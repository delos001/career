# User-facing skill introductions, printed at phase 0 by introduce.py.
# Add one entry per skill, keyed by the skill's folder name.

role-intake: |
  # role-intake - start a new application

  Takes in the job description and any recruiter messages, creates the
  application's folder, saves the job description there, and starts the
  session log.

  Steps:
    1. Read in the job description - paste it, or give a .txt / .docx / .pdf
       path or a URL - and any recruiter messages.
    2. Confirm the role title and company.
    3. Create the application folder.
    4. Save the job description; you get its path to review.
    5. Start the session log.

  Next: role-research researches the industry, company and title.

  Have ready: the job description, and any recruiter / hiring-manager messages.

role-research: |
  # role-research - research the industry, company and title

  Runs after role-intake, from the application folder, so a fresh session works.

  Steps:
    1. Research the industry, the company and the title - scoped to what later
       skills need, not exhaustive dossiers.
    2. Write the research file.
    3. Check it, then you review and approve.

  Next: role-extract pulls out the job's requirements and ranks its needs.

  Have ready: the APP-NNN of a role that has finished role-intake.

role-extract: |
  # role-extract - extract the requirements and rank the needs

  Runs after role-research, from the application folder, so a fresh session
  works.

  Steps:
    1. Pull out the job's requirements in the JD's own words, and check each
       one against the JD before going on.
    2. Label each requirement by kind, describe the job, group the
       requirements into the work the role delivers, and rank those needs.
       Boilerplate and other rows that are not needs are set aside, so later
       steps never use them.
    3. Check both, then you confirm the ranking section by section.

  Next: role-classify classifies the job against the five axes.

  Have ready: the APP-NNN of a role that has finished role-research.

  Operates under rules/global-rules.md - halts and asks for direction on any
  failure or ambiguity rather than guessing.

role-classify: |
  # role-classify - classify the job

  Runs after role-extract, from the application folder, so a fresh session
  works.

  Steps:
    1. Classify the job against the five axes (orientation, industry,
       specialty, level, work-state). Every axis must resolve to a value with a
       rule file; if one is missing, the skill pauses so it can be built.
    2. Check the classification, then you approve.

  Next: retrieval finds the profile content that fits the job.

  Have ready: the APP-NNN of a role that has finished role-extract.

  Operates under rules/global-rules.md - halts and asks for direction on any
  failure or ambiguity rather than guessing.

retrieval: |
  # retrieval - surface the relevant profile content for a role

  Runs after role-classify. Reads the JD and research artifacts role-intake,
  role-research, role-extract and role-classify produced, then scores every relevant piece of your profile (inventory
  entries, narratives, Signature Themes) against the role's critical
  requirements. Produces one artifact: a retrieval manifest that downstream
  skills (gap analysis, CV creation, interview prep, career brief) read as
  their starting point.

  Steps:
    1. Locate the application folder (new application or resume by APP-NNN).
    2. Read the role-intake, role-extract and role-classify outputs - session_log.md (axis classification),
       jd_needs.md (the requirements), and jd.md.
    3. Build per-corpus payloads from inventory, narratives, and positioning.
    4. Score each corpus against the critical requirements list (inventory
       and narratives are chunked; a seed chunk is scored first so shared
       calibration entries can keep every chunk on one scale).
    5. Compute deterministic axis signals against the JD axis classification;
       walk Linked-Inventory for narratives; assemble the manifest.
    6. QC the manifest and hand off.

  The manifest exposes raw signals (semantic score, axis exact-match count,
  axis adjacency-weighted score) per entry. Downstream skills derive their
  own tier cutoffs (gap analysis: strong/moderate/weak; CV creation:
  primary/supporting/drop), so retrieval does NOT pre-classify entries.

  Have ready: completed role-intake, role-research, role-extract and role-classify runs for
  the role.

  Operates under rules/global-rules.md - halts and asks for direction on any
  failure or ambiguity rather than guessing.

gap-analysis: |
  # gap-analysis - evaluate candidate-to-role fit

  Runs after retrieval. Reads role-research's research file (critical
  requirements + role context) and the retrieval manifest (scored inventory,
  narratives, themes), then evaluates fit per critical requirement, walks
  any gaps interactively with you to close or categorize them, scores fit,
  and produces a gap analysis artifact. This is a stopping point: you read the artifact and decide
  whether to pursue the role.

  Steps:
    1. Locate the application folder (new application or resume by APP-NNN).
    2. Load the research and retrieval artifacts plus your eligibility
       preferences from user-info.md.
    3. Surface any eligibility flags (sponsorship, geographic, exclusions)
       for you to override or stop.
    4. Detect per-requirement coverage (covered / gap / language-shift) at
       arc level first, then entry level.
    5. Walk gaps with you: you may provide clarifying information that
       closes a gap. New information is queued for the staging file.
    6. Group the gaps into themes and generate the recommendation (Proceed /
       Proceed with caution / Do not pursue) with the conditions it depends on.
    7. Write the gap analysis artifact, append staging entries, write the
       session log section, then QC.
    8. Present the decision block and ask whether to pursue.

  New information you raise during gap closure is captured to a profile-level
  staging file (personal/profile/profile_updates_pending.md). A separate
  profile-update skill processes that file into inventory / narratives /
  positioning when you're ready - you can run it immediately at the end of
  this skill or defer.

  Have ready: a completed retrieval run for the role (the application
  folder must contain retrieval.md).

  Operates under rules/global-rules.md - halts and asks for direction on any
  failure or ambiguity rather than guessing.

cv-targeted: |
  # cv-targeted - draft a role-tailored CV

  Runs after gap-analysis. Reads the role-research research (critical
  requirements + axis classification), the retrieval manifest, the gap
  analysis, and your inventory / narratives, then drafts a CV tailored to this
  role. Produces one artifact: cv_content.md (text only, with a source citation
  on every line). A separate render skill (cv-render) turns it into a formatted
  .docx later.

  Steps:
    1. Locate the application folder (new application or resume by APP-NNN).
    2. Load the upstream artifacts (research, retrieval manifest, gap analysis)
       plus the CV structure rules and the relevant axis files.
    3. A drafter agent writes the CV, applying the structure rules and axes to
       your inventory and citing the source entry for every bullet, summary
       claim, and competency.
    4. Three reviewers (a career-development expert, a hiring manager, and a
       candidate advocate who fights against underselling you) review the draft
       in parallel; the drafter revises until all are satisfied or a review cap
       is reached.
    5. QC checks correctness and traceability (every claim traces to a real
       inventory entry; format, structure, and length-guard rules hold).
    6. Write cv_content.md, write the session log section, then hand off.

  The drafter is the sole writer - reviewers and QC return findings and the
  drafter applies them - so every claim stays traceable to your inventory.
  Length is guarded by a conservative estimate here and confirmed at the render
  stage.

  Have ready: a completed gap-analysis run for the role (the application folder
  must contain gap_analysis.md).

  Operates under rules/global-rules.md - halts and asks for direction on any
  failure or ambiguity rather than guessing.

cv-render: |
  # cv-render - render the targeted CV to a formatted .docx

  Runs after cv-targeted. Reads the cv_content.md that cv-targeted produced and
  renders it to a Word document using the format settings in
  rules/cv/cv-format.yaml. Produces one artifact: the .docx CV.

  Steps:
    1. Locate the application folder (by APP-NNN) and confirm cv_content.md
       exists (if not, you are directed to run cv-targeted first).
    2. Build the output filename from your name, the company, the role, and the
       month; you confirm or override it.
    3. Render the .docx via scripts/cv_to_docx.py.
    4. Report the output path. Open it in Word to confirm pagination (markdown
       has no geometry, so the true page count is only knowable once rendered).

  The render carries no judgment: it does not rewrite, re-order, or re-cite
  content. cv_content.md is the sole input, and the citation comments in it are
  stripped, never shown.

  Have ready: a completed cv-targeted run for the role (the application folder
  must contain cv_content.md).

  Operates under rules/global-rules.md - halts and asks for direction on any
  failure or ambiguity rather than guessing.

profile-update: |
  # profile-update - promote staged updates into your profile

  New facts about your experience get captured during gap analysis and interview
  prep, into a staging file (personal/profile/profile_updates_pending.md). This
  skill is what writes them into your profile. Until it runs, a staged fact does
  not exist as far as retrieval, gap analysis, and CV creation are concerned.

  This is the only skill that writes to inventory.md. Every other one reads.

  Steps:
    1. Show what is staged and waiting, and how far back it goes.
    2. Agree which entries this run will process (all, a subset, or the oldest
       few). On a long backlog you are offered a way to work in clusters.
    3. Walk each entry one at a time: what was captured, what your profile
       already says about it, and one proposed disposition - a new entry, an
       edit to an existing entry, or no change. You see the actual text before
       anything is written.
    4. Write it. The staged entry stays in the queue until the write passes
       review.
    5. Review what was written, then delete each passing entry from the queue.
    6. Report what changed and what is still waiting.

  Framing guards in a captured note (for example "frame as review, not
  ownership") are treated as binding instructions, not commentary.

  Have ready: nothing. The staging file is the input.

  Operates under rules/global-rules.md - halts and asks for direction on any
  failure or ambiguity rather than guessing.
