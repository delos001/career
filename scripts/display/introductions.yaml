# User-facing skill introductions, printed at phase 0 by introduce.py.
# Add one entry per skill, keyed by the skill's folder name.

role-intake: |
  # role-intake - understand the job

  Builds the foundational understanding of a job opportunity. It does not write a
  CV or a gap analysis (later skills do). It produces two artifacts for downstream
  use: a session log and a research file.

  Steps:
    1. Ingest the job description - paste it, or give a .txt / .docx / .pdf path
       or a URL.
    2. Pull in any role communications (e.g. a recruiter email): place them in the
       same folder as the JD and they are read in too.
    3. Confirm role title and company (you are prompted if absent from the JD).
    4. Research the company, role, and industry - scoped to what the skill needs,
       not exhaustive dossiers.
    5. Classify the job against the five axes. An axis with no rule file yet is
       flagged and deferred, not blocked.
    6. Write the session log and research file, then QC them.

  Have ready: the job description, and any recruiter / hiring-manager messages.

  Operates under rules/global-rules.md - halts and asks for direction on any
  failure or ambiguity rather than guessing.

retrieval: |
  # retrieval - surface the relevant profile content for a role

  Runs after role-intake. Reads the JD and research artifacts the role-intake
  skill produced, then scores every relevant piece of your profile (inventory
  entries, narratives, Signature Themes) against the role's critical
  requirements. Produces one artifact: a retrieval manifest that downstream
  skills (gap analysis, CV creation, interview prep, career brief) read as
  their starting point.

  Steps:
    1. Locate the application folder (new application or resume by APP-NNN).
    2. Read the role-intake outputs - research.md (axis classification +
       critical requirements) and jd.md.
    3. Build per-corpus payloads from inventory, narratives, and positioning.
    4. Score each corpus against the critical requirements list (three
       parallel scoring passes; inventory is chunked).
    5. Compute deterministic axis signals against the JD axis classification;
       walk Linked-Inventory for narratives; assemble the manifest.
    6. QC the manifest and hand off.

  The manifest exposes raw signals (semantic score, axis exact-match count,
  axis adjacency-weighted score) per entry. Downstream skills derive their
  own tier cutoffs (gap analysis: strong/moderate/weak; CV creation:
  primary/supporting/drop), so retrieval does NOT pre-classify entries.

  Have ready: a completed role-intake run for the role (the application
  folder must contain jd.md and research.md).

  Operates under rules/global-rules.md - halts and asks for direction on any
  failure or ambiguity rather than guessing.

gap-analysis: |
  # gap-analysis - evaluate candidate-to-role fit

  Runs after retrieval. Reads role-intake's research file (critical
  requirements + role context) and the retrieval manifest (scored inventory,
  narratives, themes), then evaluates fit per critical requirement, walks
  any gaps interactively with you to close or categorize them, scores fit,
  identifies experience to de-emphasize, and produces a gap analysis
  artifact. This is a stopping point: you read the artifact and decide
  whether to pursue the role.

  Steps:
    1. Locate the application folder (new application or resume by APP-NNN).
    2. Load the role-intake and retrieval artifacts plus your eligibility
       preferences from user-info.md.
    3. Surface any eligibility flags (sponsorship, geographic, exclusions)
       for you to override or stop.
    4. Detect per-requirement coverage (covered / gap / language-shift) at
       arc level first, then entry level.
    5. Walk gaps with you: you may provide clarifying information that
       closes a gap. New information is queued for the staging file.
    6. Compute fit score, identify experience to de-emphasize, generate
       recommendation (Proceed / Proceed with caution / Do not pursue).
    7. Write the gap analysis artifact, append staging entries, write the
       session log section, then QC.
    8. Present the decision block and ask whether to pursue.

  New information you raise during gap closure is captured to a profile-level
  staging file (personal/profile/profile_updates_pending.md). A separate
  profile-update skill processes that file into inventory / narratives /
  positioning when you're ready - you can run it immediately at the end of
  this skill or defer.

  Have ready: a completed retrieval run for the role (the application
  folder must contain retrieval.md).

  Operates under rules/global-rules.md - halts and asks for direction on any
  failure or ambiguity rather than guessing.

cv-targeted: |
  # cv-targeted - draft a role-tailored CV

  Runs after gap-analysis. Reads the role-intake research (critical
  requirements + axis classification), the retrieval manifest, the gap
  analysis, and your inventory / narratives, then drafts a CV tailored to this
  role. Produces one artifact: cv_content.md (text only, with a source citation
  on every line). A separate render skill (cv-render) turns it into a formatted
  .docx later.

  Steps:
    1. Locate the application folder (new application or resume by APP-NNN).
    2. Load the upstream artifacts (research, retrieval manifest, gap analysis)
       plus the CV structure rules and the relevant axis files.
    3. A drafter agent writes the CV, applying the structure rules and axes to
       your inventory and citing the source entry for every bullet, summary
       claim, and competency.
    4. Three reviewers (a career-development expert, a hiring manager, and a
       candidate advocate who fights against underselling you) review the draft
       in parallel; the drafter revises until all are satisfied or a review cap
       is reached.
    5. QC checks correctness and traceability (every claim traces to a real
       inventory entry; format, structure, and length-guard rules hold).
    6. Write cv_content.md, write the session log section, then hand off.

  The drafter is the sole writer - reviewers and QC return findings and the
  drafter applies them - so every claim stays traceable to your inventory.
  Length is guarded by a conservative estimate here and confirmed at the render
  stage.

  Have ready: a completed gap-analysis run for the role (the application folder
  must contain gap_analysis.md).

  Operates under rules/global-rules.md - halts and asks for direction on any
  failure or ambiguity rather than guessing.

cv-render: |
  # cv-render - render the targeted CV to a formatted .docx

  Runs after cv-targeted. Reads the cv_content.md that cv-targeted produced and
  renders it to a formatted Word document matching your CV format spec (Calibri
  11pt, native middle-dot bullets, US Letter with 1-inch margins, page-number
  footer). Produces one artifact: the .docx CV.

  Steps:
    1. Locate the application folder (by APP-NNN) and confirm cv_content.md
       exists (if not, you are directed to run cv-targeted first).
    2. Build the output filename from your name, the company, the role, and the
       month; you confirm or override it.
    3. Render the .docx via scripts/cv_to_docx.py.
    4. Report the output path. Open it in Word to confirm pagination (markdown
       has no geometry, so the true page count is only knowable once rendered).

  The render carries no judgment: it does not rewrite, re-order, or re-cite
  content. cv_content.md is the sole input, and the citation comments in it are
  stripped, never shown.

  Have ready: a completed cv-targeted run for the role (the application folder
  must contain cv_content.md).

  Operates under rules/global-rules.md - halts and asks for direction on any
  failure or ambiguity rather than guessing.
