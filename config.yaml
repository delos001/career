# Repo-structure config for the career repo.
#
# Holds the folder names, filenames, and ID scheme that the scripts in scripts/
# depend on, so a repo reorganization is a config edit rather than a code change.
# Scripts resolve the repo root from their own location (never an absolute path);
# every path below is relative to that root.

# Folders, relative to the repo root.
paths:
  personal: personal                     # root of the private nested personal/ repo (holds applications, profile, and cross-application files like company-slugs.yaml)
  applications: personal/applications    # one folder per evaluated job
  profile: personal/profile              # candidate's profile documents (inventory, narratives, positioning, user-info)
  templates: templates                   # artifact templates
  rules: rules                           # axis rule files (one folder per axis)
  profile_rules: rules/profile           # writing rules for the profile documents and the staging file, read through scripts/rules_slice.py
  cv_rules: rules/cv                     # CV structure and best-practice rules
  design: design                         # design state and build issue logs
  temp: temp                             # shared dev-scratch / reference material; per-application run-scratch now lives in <app-folder>/scratch/ (see filenames.scratch_subdir)
  self_assessment_rules: rules/self-assessment   # protocol + bootstrap prompt (generic, shareable)
  self_assessment_runs: personal/self-assessment # runs: products at root, trails in dated subfolders

# Filenames.
filenames:
  research_file: research.md                   # written into each application folder
  session_log_file: session_log.md             # written into each application folder by role-intake; shared multi-skill log appended to by downstream skills
  jd_file: jd.md                               # JD persisted into each application folder
  comms_file: comms.md                         # role communications persisted into each application folder
  session_log_template: session_log.md         # in the templates/ folder
  research_file_template: research_file.md      # in the templates/ folder
  introductions: introductions.yaml            # next to scripts/display/introduce.py
  axis_registry: registry.md                   # in each rules/<axis>/ folder
  requirement_kinds_file: jd-requirement-kinds.md  # in the rules folder; kinds of JD requirement rows, parsed by requirement_kinds.py
  jd_needs_file: jd_needs.md                   # written into each application folder by role-classify; each requirement's kind and the ranked needs
  build_issues_log: build_issues.md            # in the design/ folder; appended to on provisional builds
  retrieval_manifest: retrieval.md             # written into each application folder by the retrieval skill
  gap_analysis_file: gap_analysis.md           # written into each application folder by the gap-analysis skill
  gap_analysis_template: gap_analysis.md       # in the templates/ folder
  staging_file: profile_updates_pending.md     # in the profile/ folder; cross-application staging of new info raised during gap-analysis
  inventory_file: inventory.md                 # in the profile/ folder
  inventory_template: inventory.md             # in the templates/ folder; structure authority parsed by profile_update_qc.py
  inventory_retired_file: inventory-ret.md     # in the profile/ folder; retired entry and element IDs, read by profile_slice.py as a fallback
  narratives_file: narratives.md               # in the profile/ folder
  positioning_file: positioning.md             # in the profile/ folder
  user_info_file: user-info.md                 # in the profile/ folder
  cv_content_file: cv_content.md               # written into each application folder by the cv-targeted skill
  cv_structure_file: cv-structure.md           # in the cv_rules folder; its Section order block is parsed by cv_qc.py (S1, S2)
  interview_prep_file: interview_prep.md       # written into each application folder by the preparation-screen skill (preparation-interview appends later)
  interview_prep_template: interview_prep.md   # in the templates/ folder; structure authority parsed by prep_qc.py
  interview_notes_file: interview_notes.md     # written into each application folder by the interview-notes skill; hand-filled during interviews
  interview_notes_template: interview_notes.md # in the templates/ folder; structure authority parsed by notes_assemble.py
  drafting_plan_file: drafting_plan.md          # cv-targeted internal working file (framing, page budget, arbitration log); application folder
  cv_collaboration_log_file: cv_collaboration_log.md  # cv-targeted per-round record of stakeholder contributions, integration, and QC; application folder
  scratch_subdir: scratch                      # run-scratch subfolder name; per-application pipeline scratch is <app-folder>/scratch/ (wiped at decline/close), axis-builder scratch is rules/scratch/ (wiped at end of build); both via scratch_cleanup.py
  company_slugs_file: company-slugs.yaml       # at the personal/ root; maps a company name to its preferred folder slug for reuse across applications
  assessment_protocol: assessment-protocol.md  # in rules/self-assessment/; the versioned self-assessment protocol (single authority)
  assessment_bootstrap: bootstrap-prompt.md    # in rules/self-assessment/; portable starter prompt, zero method content

# Per-axis schema. Consumed by scripts/axis_qc.py and by the axis-builder
# skills. Each entry defines the value-file frontmatter key, the required
# section headings (in canonical order), and the standard "Used by:" consumers
# line. Keys match the folder names under rules/.
axes:
  industries:
    frontmatter_key: industry
    required_sections: [Vocabulary, Dialect, Emphasis, Adjacency]
    used_by: cv-targeted, axis-classifier
  specialties:
    frontmatter_key: specialty
    required_sections: [Capability vocabulary, Terminology, Knowledge-transfer mode, Adjacency]
    used_by: cv-targeted, axis-classifier
  orientations:
    frontmatter_key: orientation
    required_sections: [Identity, Summary lead, Section emphasis, Adjacency]
    used_by: cv-targeted, axis-classifier
  levels:
    frontmatter_key: level
    required_sections: [Identity, Voice, Verb vocabulary, Scope signals, Adjacency]
    used_by: cv-targeted, axis-classifier
  work-states:
    frontmatter_key: work-state
    required_sections: [Identity, Achievement framing, Adjacency]
    used_by: cv-targeted, axis-classifier

# Retrieval cross-chunk score calibration (design/retrieval_calibration_plan.md).
# Every chunk of a multi-chunk corpus scores the same anchors; the merge maps
# each chunk onto one scale from them.
retrieval_calibration:
  inventory_anchors: 10     # anchors repeated in every inventory chunk; APP-027: 6 or 8 shifted scores up to 0.14 / 0.08 vs 10, so 10 stays
  narrative_anchors: 3      # narratives are few (17 on 2026-11-04), so more would crowd the corpus
  min_anchor_span: 0.2      # a chunk's anchors spanning less than this get an offset-only correction (a slope fit would be unstable)
  slope_bounds: [0.5, 2.0]  # a fitted slope outside this range means the chunk's scoring is unusable; the merge stops
  max_post_residual: 0.08   # QC fails when anchors still disagree by more than this on average after correction; provisional

# Modifiers that set a requirement's bar (scripts/role_classify_qc.py C8). One
# case-insensitive regex each; whatever one matches in the JD clause holding a
# requirement's quote must also appear in the Text of at least one row quoting
# that clause. Add a word here when a run shows it being dropped.
requirement_qualifiers:
  - familiar(?:ity)? with
  - exposure to
  - understanding of
  - ability to
  - might
  - a plus
  - bonus
  - nice to have
  - preferred
  - preferably
  - ideally

# A year count sets a bar too, but a clause can hold one count per requirement
# ('10 years..., with at least 5 years...'), so it must survive on at least one
# row quoting that clause rather than on every row.
requirement_year_count: \d+(?:-\d+)?\+? years

# Profile-update related-entry pull (scripts/profile_slice.py related).
related_pull:
  max_chars: 50000          # a pull larger than this splits into parts, read one --part at a time
  min_shared_words: 2       # an entry outside the item's role is pulled when it shares this many key words with the item

# Rule-file staleness (scripts/staleness.py). A stamped rule file whose
# frontmatter last_researched is this many months old or more is stale.
# Decided as a repo-wide constant (design_decisions.md rule-staleness-threshold).
staleness_months: 9

# Markdown line-wrap convention (scripts/md_unwrap.py). Prose is never
# hard-wrapped: one paragraph or bullet per line. These repo-relative globs are
# the files the convention is checked and applied on.
markdown_no_wrap:
  globs:
    - templates/*.md
    - .claude/skills/*/SKILL.md
    - .claude/agents/*.md
    - rules/**/*.md
    - design/*.md
    - "*.md"
    - tests/README.md

# Naming patterns.
naming:
  # <stem> identifies one evaluated job. Tokens: {slug} {app_id} {ym}.
  # Used as the application folder name and as the base of the session-log filename.
  application_stem: "{slug}_{app_id}_{ym}"
  # Application ID: a global counter, e.g. APP-004.
  app_id_prefix: "APP-"
  app_id_digits: 3
  # Subfolder of the applications directory holding one empty marker file per
  # claimed ID (scripts/app_id.py). The marker holds the ID from the moment it
  # is printed, before ingest creates the application folder.
  app_id_claims_dir: ".app_ids"

# Self-assessment QC spec. Consumed by scripts/self_assessment_qc.py; keeps
# every pattern out of the script so protocol evolution is a config edit.
self_assessment:
  product_pattern: "profile_*.md"          # products at the runs-folder root; the skill's rerun-vs-fresh mode detection matches on this
  version_stamp_regex: "protocol v\\d+"    # locates the product's stamp; V1 compares its number to the protocol file's current Version line
  required_headings:                       # one regex per required product section, canonical order
    - "^## Who .+"
    - "^## The core pattern"
    - "^## Cognitive style"
    - "^## How .+ relate"
    - "^## .*master traits"
    - "^## Strengths"
    - "^## Where .+ may thrive"
    - "^## Weaknesses"
    - "^## Tensions"
    - "^## How .+ changed"
    - "^## Where it may bite"
    - "^## The open moves"
    - "^## In one line"
  required_labels:                         # key phrase from each mandatory How-to-read label
    - "requested and run by the person it describes"
    - "cannot show what was never"
    - "hygiene, not independence"
    - "verification path"                  # rule 11: trail + underlying record remain the verification path
  scope_marker: "\\*\\*Scope"              # corpus-limitation statement marker
  confidence_terms: [low, moderate, high]  # anchored vocabulary for inferred claims; must match the protocol's defined levels
  max_sentence_words: 40                   # readability proxy for rule 9's "no sentence that needs re-reading"
  max_paragraph_chars: 900                 # readability proxy for like-chunk paragraphs
